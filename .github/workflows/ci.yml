# 公开仓库的最小检查：后端单元测试走 SQLite，前端跑 vitest。
# 不连内网，不注入密钥。test_live_* 没设 LIVE_BASE 时会自行跳过。
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy-platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Test
        run: pytest tests/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: deploy-platform/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
