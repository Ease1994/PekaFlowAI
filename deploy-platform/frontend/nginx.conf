# PekaFlowAI · 前端 Nginx 主配置（覆盖官方镜像的 nginx.conf）
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # 后端靠请求头推断「平台对外地址」，再回填进 Agent 安装脚本。本容器只监听 80，
    # $scheme 恒为 http，直接用它会把外层 HTTPS 卸载后传来的 https 覆盖掉——
    # 上了 HTTPS 域名后脚本里就会回填成 http://，装机时 Agent 连不上或被重定向。
    #
    # 只认开头那一段：这个头经过多层代理会变成「https, http」这样的列表，
    # 整串拿去拼地址会得到 https,%20http:// 这种废话。
    map $http_x_forwarded_proto $release_proto {
        default    $scheme;
        "~*^https" https;
        "~*^http"  http;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 前端 SPA 路由（history 模式）回退到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 不要把后端 /docs、/redoc、/v3/api-docs 反代出来。
        # 接口清单在登录后的「调用手册」页，内嵌官方 Swagger UI，走 /api/v1/meta/openapi。

        # 后端 API 反代。AI 对话是 SSE：关缓冲、拉长读超时，否则首包未到就会被掐，
        # 前端表现为思考态突然消失、这轮像没发生过。
        location /api/ {
            client_max_body_size 400m;
            client_body_timeout 300s;
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # 覆盖客户端伪造的 X-Forwarded-Host，安装脚本不能信攻击者填的域名
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $release_proto;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # MCP 端点（AI 助手）
        location /mcp {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $release_proto;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
